[project]
name = "fastspeech2-ljspeech"
version = "0.1.0"
description = "FastSpeech2-based TTS for LJ Speech (SLP Assignment 3)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "numpy<2.0",
    "librosa>=0.10.0",
    "scipy",
    "soundfile",
    "matplotlib",
    "tqdm",
    "wandb",
    "openai-whisper",
    "jiwer",
    "einops",
    "tensorboardX",
    "reportlab>=4.5.1",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fs2"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
